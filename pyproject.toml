[project]
name = "quant-engine-mcp"
version = "0.1.0"
description = "Deterministic portfolio allocation and risk calculations MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.5",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "PyPortfolioOpt>=1.5.6,<2",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
